<!-- https://remark42.com/ -->
{% assign remark42 = site.comments.remark42 %}
{% if remark42.host and remark42.host != empty %}
  {% assign remark42_site_id = remark42.site_id | default: 'remark' %}
  {% assign remark42_theme = remark42.theme | default: site.theme_mode | default: 'light' %}
  <script>
    var remark_config = {
      host: {{ remark42.host | jsonify }},
      site_id: {{ remark42_site_id | jsonify }},
      url: {{ page.url | absolute_url | jsonify }},
      title: {{ page.title | jsonify }},
      components: ['embed'],
      max_shown_comments: {{ remark42.max_shown_comments | default: 20 }},
      theme: {{ remark42_theme | jsonify }}
    };
  </script>
  <div id="remark42">Comments loading...</div>
  <script>
    !function(e,n){for(var o=0;o<e.length;o++){var r=n.createElement('script'),c='.js',d=n.head||n.body;'noModule'in r?(r.type='module',c='.mjs'):r.async=!0,r.defer=!0,r.src=remark_config.host+'/web/'+e[o]+c,d.appendChild(r)}}(remark_config.components||['embed'],document);
  </script>
{% else %}
  <!-- Remark42 comments are enabled but comments.remark42.host is empty. -->
{% endif %}
